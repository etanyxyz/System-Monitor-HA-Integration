name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches the tag
        run: |
          python - <<'EOF'
          import json, os, pathlib, sys

          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          manifest = json.loads(
              pathlib.Path("custom_components/resource_monitor/manifest.json").read_text()
          )
          if manifest["version"] != tag:
              sys.exit(f"manifest version {manifest['version']} != tag {tag}")
          print(f"version {tag} ok")
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
